# Нормы и параметры. Скопировать в config.yaml и поправить под бренд.
logistics:
  sales_window_days: 14     # окно для средних продаж
  lead_time_days: 7         # срок от заказа до приёмки на складе
  cover_days: 30            # на сколько дней везём запас
  min_stock_days: 14        # ниже — нужна поставка
  max_stock_days: 60        # выше — риск платного хранения

ads:
  max_drr: 0.12             # предельная ДРР по артикулу
  min_ctr: 0.02             # ниже — проблема с карточкой на выдаче
  min_cart_to_order: 0.25

pricing:
  target_margin: 0.20       # целевая маржа после всех расходов
  ads_share: 0.08           # заложенная доля рекламы в цене
